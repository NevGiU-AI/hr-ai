version: '3.9'

services:

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav-data:/var/lib/clamav

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "local-redis-secret"]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "local-redis-secret", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hr_ai
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: super-secret
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_ai"]
      interval: 5s
      timeout: 5s
      retries: 5



  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hr_ai
      SPRING_DATASOURCE_USERNAME: hr_user
      SPRING_DATASOURCE_PASSWORD: super-secret
      APP_FLYWAY_BASELINE_ON_MIGRATE: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: 6379
      APP_REDIS_PASSWORD: local-redis-secret
      APP_REDIS_SESSION_NAMESPACE: hr-ai:session:local
      APP_SECURITY_MAXIMUM_SESSIONS: 3
      APP_REDIS_SECURITY_NAMESPACE: hr-ai:security:login:local
      APP_CV_STORAGE_ROOT: /var/lib/hr-ai/cv-originals
      APP_CV_STORAGE_RETENTION: ${APP_CV_STORAGE_RETENTION:-365d}
      APP_CV_MALWARE_SCAN_ENABLED: "true"
      APP_CV_MALWARE_SCAN_HOST: clamav
      APP_CV_MALWARE_SCAN_PORT: 3310
      #JWT_SECRET: change-me-change-me-change-me-change-me
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - ./data/cv-originals:/var/lib/hr-ai/cv-originals
    restart: on-failure:3

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  redis-data:
  clamav-data:
