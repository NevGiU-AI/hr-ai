<section class="login-shell">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <p class="eyebrow">Secure access</p>
    <h1>Sign in to HR AI</h1>
    <p>Use the account provided by your administrator.</p>

    <div class="alert alert-danger" role="alert" *ngIf="error">{{ error }}</div>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
      <small *ngIf="form.controls.email.touched && form.controls.email.invalid">Enter a valid email address.</small>
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
      <small *ngIf="form.controls.password.touched && form.controls.password.invalid">Password is required.</small>
    </label>

    <button class="btn btn-primary" type="submit" [disabled]="submitting">
      {{ submitting ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</section>
