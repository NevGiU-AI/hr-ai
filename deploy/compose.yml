name: nevgiu-hr-ai

services:
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      APP_FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      SPRING_JPA_SHOW_SQL: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      APP_CV_INGESTION_INITIAL_IMPORT_ENABLED: ${INITIAL_IMPORT_ENABLED:-false}
      APP_SECURITY_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_SECURITY_BOOTSTRAP_ADMIN_ORGANIZATION: ${BOOTSTRAP_ADMIN_ORGANIZATION:-default}
      APP_SECURITY_SECURE_COOKIE: "true"
      APP_SECURITY_SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      APP_SECURITY_MAXIMUM_SESSIONS: ${SECURITY_MAXIMUM_SESSIONS:-3}
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
      APP_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      APP_REDIS_SESSION_NAMESPACE: ${REDIS_SESSION_NAMESPACE:-hr-ai:session}
      APP_REDIS_SECURITY_NAMESPACE: ${REDIS_SECURITY_NAMESPACE:-hr-ai:security:login}
      APP_SECURITY_LOGIN_ACCOUNT_FAILURE_LIMIT: ${LOGIN_ACCOUNT_FAILURE_LIMIT:-5}
      APP_SECURITY_LOGIN_IP_FAILURE_LIMIT: ${LOGIN_IP_FAILURE_LIMIT:-20}
      APP_SECURITY_LOGIN_FAILURE_WINDOW: ${LOGIN_FAILURE_WINDOW:-15m}
      APP_SECURITY_LOGIN_LOCK_DURATION: ${LOGIN_LOCK_DURATION:-15m}
      APP_SECURITY_AUDIT_RETENTION: ${SECURITY_AUDIT_RETENTION:-365d}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - data
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    environment:
      API_URL: https://${API_HOST}/api
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST}
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
