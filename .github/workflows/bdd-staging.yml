name: Browser BDD staging

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy staging
    types:
      - completed

permissions:
  contents: read
  # BDD means behavior-driven development. The trusted post-deployment job promotes already-built immutable images
  # only after every required BDD scenario succeeds. It does not rebuild images or receive general repository write
  # access.
  packages: write

concurrency:
  group: browser-bdd-staging
  cancel-in-progress: false

jobs:
  browser-bdd:
    name: Cucumber and Playwright smoke tests
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.BDD_BASE_URL }}
    env:
      REGISTRY: ghcr.io
      REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
      BDD_BASE_URL: ${{ vars.BDD_BASE_URL }}
      BDD_API_URL: ${{ vars.BDD_API_URL }}
      BDD_RECRUITER_EMAIL: ${{ secrets.BDD_RECRUITER_EMAIL }}
      BDD_RECRUITER_PASSWORD: ${{ secrets.BDD_RECRUITER_PASSWORD }}
      BDD_ADMIN_EMAIL: ${{ secrets.BDD_ADMIN_EMAIL }}
      BDD_ADMIN_PASSWORD: ${{ secrets.BDD_ADMIN_PASSWORD }}
      BDD_CANDIDATE_QUERY: ${{ secrets.BDD_CANDIDATE_QUERY }}
      BDD_CANDIDATE_NAME: ${{ secrets.BDD_CANDIDATE_NAME }}
      BDD_CANDIDATE_QUESTION: ${{ secrets.BDD_CANDIDATE_QUESTION }}
      BDD_HEADLESS: 'true'
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REVISION }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          # workflow_run receives a read-only cache token. Do not request a cache save or widen permissions in this
          # protected-secret job merely to optimize dependency downloads.

      - name: Validate protected BDD configuration
        shell: bash
        run: |
          required=(
            BDD_BASE_URL BDD_API_URL
            BDD_RECRUITER_EMAIL BDD_RECRUITER_PASSWORD
            BDD_ADMIN_EMAIL BDD_ADMIN_PASSWORD
            BDD_CANDIDATE_QUERY BDD_CANDIDATE_NAME BDD_CANDIDATE_QUESTION
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing staging BDD configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Compile browser tests
        working-directory: e2e
        run: mvn -B --no-transfer-progress test-compile

      - name: Install pinned Chromium and system dependencies
        working-directory: e2e
        run: >-
          mvn -B --no-transfer-progress exec:java
          -Dexec.classpathScope=test
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"

      - name: Run browser BDD smoke tests
        working-directory: e2e
        # Maven's local default is "not @provider and not @destructive". This override deliberately admits the one
        # controlled provider-backed citation scenario. Boolean Cucumber syntax means "not @destructive" still skips
        # every scenario explicitly tagged @destructive; do not remove that boundary merely to increase coverage.
        # A scenario that erases shared candidates, CVs, jobs, accounts, or retention state must carry that tag.
        run: >-
          mvn -B --no-transfer-progress -Pbdd
          "-Dcucumber.filter.tags=not @destructive"
          verify

      - name: Set lowercase image names
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_NAME=$repository/hr-ai-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE_NAME=$repository/hr-ai-frontend" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_run'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for validation promotion
        if: github.event_name == 'workflow_run'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Production checks these exact revision aliases. Publishing them only here prevents health-only staging smoke
      # tests, an older successful BDD run, or a different commit from authorizing production promotion.
      - name: Publish BDD validation aliases
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$BACKEND_IMAGE_NAME:bdd-validated-$REVISION" \
            "$REGISTRY/$BACKEND_IMAGE_NAME:$REVISION"
          docker buildx imagetools create \
            --tag "$REGISTRY/$FRONTEND_IMAGE_NAME:bdd-validated-$REVISION" \
            "$REGISTRY/$FRONTEND_IMAGE_NAME:$REVISION"

      - name: Verify BDD validation aliases
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          docker buildx imagetools inspect \
            "$REGISTRY/$BACKEND_IMAGE_NAME:bdd-validated-$REVISION"
          docker buildx imagetools inspect \
            "$REGISTRY/$FRONTEND_IMAGE_NAME:bdd-validated-$REVISION"

      - name: Summarize BDD release gate
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          {
            echo "### Staging browser BDD accepted"
            echo "- Commit: \`$REVISION\`"
            echo "- Production gate: exact-revision BDD aliases published"
          } >> "$GITHUB_STEP_SUMMARY"

      # Manual runs are useful for diagnosis, but they cannot prove which revision is currently deployed to staging.
      # They therefore never publish an alias that production could treat as release authorization.
      - name: Summarize manual validation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          {
            echo "### Manual staging browser BDD completed"
            echo "- Commit checked out: \`$REVISION\`"
            echo "- Production gate: unchanged (manual runs cannot publish validation aliases)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The report can contain the disposable candidate's visible card. Keep it private and short-lived.
      - name: Upload private failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-bdd-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/target/cucumber-report.html
            e2e/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 1
