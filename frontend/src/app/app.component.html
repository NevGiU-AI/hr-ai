<header class="app-header">
  <a class="brand" routerLink="/jobs/job-offer" aria-label="NevGiu HR AI Recruitment home">
    <img src="/nevgiu_logo.png" alt="NevGiu" />
    <span>HR AI Recruitment</span>
  </a>
  <nav aria-label="Primary navigation" *ngIf="auth.user$ | async as user">
    <a routerLink="/jobs/job-offer" routerLinkActive="active">Generate job</a>
    <a routerLink="/jobs/job-listing" routerLinkActive="active">Approved jobs</a>
    <a routerLink="/candidates/import" routerLinkActive="active">CVs & Evaluation</a>
    <a routerLink="/account/password" routerLinkActive="active">Change password</a>
    <a *ngIf="user.roles.includes('ADMIN')" routerLink="/admin/users" routerLinkActive="active">Users</a>
    <a *ngIf="user.roles.includes('ADMIN')" routerLink="/admin/security-events" routerLinkActive="active">Security events</a>
    <span class="signed-in-user">{{ user.email }}</span>
    <button type="button" (click)="logout()">Sign out</button>
  </nav>
</header>
<main>
  <router-outlet />
</main>
