<section class="password-shell">
  <h1>Change password</h1>
  <p>Changing your password signs out every active session, including this one.</p>
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Current password<input type="password" formControlName="currentPassword" autocomplete="current-password" /></label>
    <label>New password<input type="password" formControlName="newPassword" autocomplete="new-password" />
      <small>Use between 12 and 128 characters.</small></label>
    <label>Confirm new password<input type="password" formControlName="confirmation" autocomplete="new-password" /></label>
    <button class="btn btn-primary" type="submit" [disabled]="submitting">{{ submitting ? 'Changing…' : 'Change password' }}</button>
  </form>
</section>
