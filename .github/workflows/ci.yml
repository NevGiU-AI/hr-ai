name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        working-directory: backend
        run: mvn -B clean verify

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --configuration=production

  containers:
    name: Container builds
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: hr-ai-backend:ci
          cache-from: type=gha,scope=ci-backend
          # Cache export is an optimization. A transient GitHub cache write
          # failure must not turn an otherwise valid image build red.
          cache-to: type=gha,mode=max,scope=ci-backend,ignore-error=true

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: hr-ai-frontend:ci
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend,ignore-error=true

      - name: Validate deployment model
        env:
          # Compose requires a non-empty value. This check only renders the
          # deployment model and does not start Redis or use a real secret.
          REDIS_PASSWORD: ci-compose-validation-only
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yml config --quiet

      - name: Validate deployment shell scripts
        run: bash -n deploy/*.sh
