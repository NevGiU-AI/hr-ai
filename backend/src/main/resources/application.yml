spring:
  application:
    name: hr-ai-recruitment

  datasource:
    url: jdbc:postgresql://db:5432/hr_ai
    username: hr_user
    password: super-secret
    driver-class-name: org.postgresql.Driver


  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: ${APP_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 0
    validate-migration-naming: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  data:
    redis:
      host: ${APP_REDIS_HOST:localhost}
      port: ${APP_REDIS_PORT:6379}
      password: ${APP_REDIS_PASSWORD:local-redis-secret}
      timeout: 2s
      repositories:
        # Business repositories are JPA-backed; Redis is used directly for sessions and security counters.
        enabled: false
  session:
    redis:
      flush-mode: immediate
      repository-type: indexed
      namespace: ${APP_REDIS_SESSION_NAMESPACE:hr-ai:session}
#      embedding:
#    vectorstore:
#      pgvector:
#        initialize-schema: true
#        table-name: document_chunks
#        index-type: hnsw
#        distance-type: COSINE_DISTANCE

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${APP_SECURITY_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${APP_SECURITY_SECURE_COOKIE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    bootstrap-admin-email: ${APP_SECURITY_BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-organization: ${APP_SECURITY_BOOTSTRAP_ADMIN_ORGANIZATION:default}
    session-policy:
      maximum-sessions: ${APP_SECURITY_MAXIMUM_SESSIONS:3}
    login-throttle:
      namespace: ${APP_REDIS_SECURITY_NAMESPACE:hr-ai:security:login}
      account-failure-limit: ${APP_SECURITY_LOGIN_ACCOUNT_FAILURE_LIMIT:5}
      ip-failure-limit: ${APP_SECURITY_LOGIN_IP_FAILURE_LIMIT:20}
      failure-window: ${APP_SECURITY_LOGIN_FAILURE_WINDOW:15m}
      lock-duration: ${APP_SECURITY_LOGIN_LOCK_DURATION:15m}
    audit:
      retention: ${APP_SECURITY_AUDIT_RETENTION:365d}
      cleanup-cron: ${APP_SECURITY_AUDIT_CLEANUP_CRON:0 17 3 * * *}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80}
  cv-ingestion:
    max-pdf-size: 20971520
    max-archive-size: 104857600
    max-archive-entries: 100
    max-expanded-size: 104857600
    max-compression-ratio: 100
    minimum-text-length: 50
    initial-resource: classpath:intial/CVs.zip
    initial-import-enabled: true
  cv-storage:
    root: ${APP_CV_STORAGE_ROOT:./data/cv-originals}
    retention: ${APP_CV_STORAGE_RETENTION:365d}
  cv-retention:
    enabled: ${APP_CV_RETENTION_CLEANUP_ENABLED:true}
    batch-size: ${APP_CV_RETENTION_CLEANUP_BATCH_SIZE:100}
    cleanup-cron: ${APP_CV_RETENTION_CLEANUP_CRON:0 43 3 * * *}
  cv-malware:
    enabled: ${APP_CV_MALWARE_SCAN_ENABLED:false}
    host: ${APP_CV_MALWARE_SCAN_HOST:localhost}
    port: ${APP_CV_MALWARE_SCAN_PORT:3310}
    connect-timeout: ${APP_CV_MALWARE_CONNECT_TIMEOUT:2s}
    read-timeout: ${APP_CV_MALWARE_READ_TIMEOUT:30s}
  cv-ocr:
    enabled: ${APP_CV_OCR_ENABLED:false}
    command: ${APP_CV_OCR_COMMAND:tesseract}
    languages: ${APP_CV_OCR_LANGUAGES:eng+fra+por}
    dpi: ${APP_CV_OCR_DPI:300}
    max-pages: ${APP_CV_OCR_MAX_PAGES:30}
    page-timeout: ${APP_CV_OCR_PAGE_TIMEOUT:30s}
    minimum-confidence: ${APP_CV_OCR_MINIMUM_CONFIDENCE:70}
  cv-chat:
    max-evidence-pages: ${APP_CV_CHAT_MAX_EVIDENCE_PAGES:10}
    max-excerpt-characters: ${APP_CV_CHAT_MAX_EXCERPT_CHARACTERS:1200}
