<section class="login-shell">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <p class="eyebrow">Secure access</p>
    <h1>Sign in to HR AI</h1>
    <p>Use the account provided by your administrator.</p>

    <div class="alert alert-danger" role="alert" *ngIf="error">{{ error }}</div>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
      <small *ngIf="form.controls.email.touched && form.controls.email.invalid">Enter a valid email address.</small>
    </label>

    <label>
      Password
      <span class="password-field">
        <input
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          class="password-toggle"
          type="button"
          [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="passwordVisible"
          (click)="togglePasswordVisibility()"
        >
          <svg *ngIf="!passwordVisible" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg *ngIf="passwordVisible" aria-hidden="true" viewBox="0 0 24 24">
            <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.1 3M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7a10.6 10.6 0 0 0 4.1-.8" />
          </svg>
        </button>
      </span>
      <small *ngIf="form.controls.password.touched && form.controls.password.invalid">Password is required.</small>
    </label>

    <button class="btn btn-primary" type="submit" [disabled]="submitting">
      {{ submitting ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</section>
