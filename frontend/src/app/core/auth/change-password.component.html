<section class="password-shell">
  <h1>Change password</h1>
  <p>Changing your password signs out every active session, including this one.</p>
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Current password
      <span class="password-field">
        <input [type]="passwordVisible.currentPassword ? 'text' : 'password'" formControlName="currentPassword" autocomplete="current-password" />
        <button class="password-toggle" type="button" [attr.aria-label]="passwordVisible.currentPassword ? 'Hide current password' : 'Show current password'" [attr.aria-pressed]="passwordVisible.currentPassword" (click)="togglePasswordVisibility('currentPassword')">
          <svg *ngIf="!passwordVisible.currentPassword" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg *ngIf="passwordVisible.currentPassword" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.1 3M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7a10.6 10.6 0 0 0 4.1-.8"/></svg>
        </button>
      </span>
    </label>
    <label>New password
      <span class="password-field">
        <input [type]="passwordVisible.newPassword ? 'text' : 'password'" formControlName="newPassword" autocomplete="new-password" />
        <button class="password-toggle" type="button" [attr.aria-label]="passwordVisible.newPassword ? 'Hide new password' : 'Show new password'" [attr.aria-pressed]="passwordVisible.newPassword" (click)="togglePasswordVisibility('newPassword')">
          <svg *ngIf="!passwordVisible.newPassword" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg *ngIf="passwordVisible.newPassword" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.1 3M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7a10.6 10.6 0 0 0 4.1-.8"/></svg>
        </button>
      </span>
      <small>Use between 12 and 128 characters.</small></label>
    <label>Confirm new password
      <span class="password-field">
        <input [type]="passwordVisible.confirmation ? 'text' : 'password'" formControlName="confirmation" autocomplete="new-password" />
        <button class="password-toggle" type="button" [attr.aria-label]="passwordVisible.confirmation ? 'Hide password confirmation' : 'Show password confirmation'" [attr.aria-pressed]="passwordVisible.confirmation" (click)="togglePasswordVisibility('confirmation')">
          <svg *ngIf="!passwordVisible.confirmation" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg *ngIf="passwordVisible.confirmation" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.1 3M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7a10.6 10.6 0 0 0 4.1-.8"/></svg>
        </button>
      </span>
    </label>
    <button class="btn btn-primary" type="submit" [disabled]="submitting">{{ submitting ? 'Changing…' : 'Change password' }}</button>
  </form>
</section>
